<!-- login.component.html -->

<div class="login-container">

  <!-- LADO ESQUERDO -->
  <div class="left-side">

    <div class="overlay"></div>

    <div class="content">
      <h1>Lectio</h1>

      <p>
        Sua estante, reinventada
      </p>

      <span>
        Organize seus livros, acompanhe leituras
        e descubra novas histórias.
      </span>
    </div>

  </div>

  <!-- LADO DIREITO -->
  <div class="right-side">

    <div class="login-card">

      <div class="header">
        <h2>Entrar</h2>

        <p>
          Faça login para acessar sua conta
        </p>
      </div>

      <form>

        <div class="input-group">
          <label>Email</label>

          <input
            type="email"
            placeholder="exemplo@email.com"
          >
        </div>

        <div class="input-group">
          <label>Senha</label>

          <div class="password-field">

            <input
              type="password"
              placeholder="Digite sua senha"
            >

            <button type="button">
              👁
            </button>

          </div>
        </div>

        <a href="#" class="forgot-password">
          Esqueceu sua senha?
        </a>

        <button class="login-button">
          Entrar
        </button>

      </form>

      <div class="register">
        Ainda não possui conta?
        <a href="#">Cadastre-se</a>
      </div>

    </div>

  </div>

</div>
