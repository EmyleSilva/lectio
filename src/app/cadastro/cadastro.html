<div class="login-container">

  <!-- LADO ESQUERDO -->
  <div class="left-side">

    <div class="overlay"></div>

    <div class="content">
      <h1>Lectio</h1>

      <p>
        Sua estante, reinventada
      </p>

      <span>
        Organize seus livros, acompanhe leituras
        e descubra novas histórias.
      </span>
    </div>

  </div>

  <!-- LADO DIREITO -->
  <div class="right-side">

    <div class="login-card">

      <div class="header">
        <h2>Cadastre-se</h2>

        <p>
          Crie sua conta para organizar suas leituras
        </p>
      </div>

      <form>

        <div class="input-group">
          <label>Nome</label>

          <input
            type="text"
            placeholder="Seu nome completo"
          >
        </div>

        <div class="input-group">
          <label>Email</label>

          <input
            type="email"
            placeholder="exemplo@email.com"
          >
        </div>

        <div class="input-group">
          <label>Senha</label>

          <div class="password-field">

            <input
              type="password"
              placeholder="Crie uma senha"
            >

            <button type="button">
              👁
            </button>

          </div>
        </div>

        <div class="input-group">
          <label>Confirmar Senha</label>

          <div class="password-field">

            <input
              type="password"
              placeholder="Confirme sua senha"
            >

            <button type="button">
              👁
            </button>

          </div>
        </div>

        <button class="login-button">
          Criar Conta
        </button>

      </form>

      <div class="register">
        Já possui conta?
        <a routerLink="/login">Entrar</a>
      </div>

    </div>

  </div>

</div>
