<div class="login-container">

  <!-- LADO ESQUERDO -->
  <div class="left-side">

    <div class="overlay"></div>

    <div class="content">
      <h1>Lectio</h1>

      <p>
        Sua estante, reinventada
      </p>

      <span>
        Organize seus livros, acompanhe leituras
        e descubra novas histórias.
      </span>
    </div>

  </div>

  <!-- LADO DIREITO -->
  <div class="right-side">

    <div class="login-card">

      <div class="header">
        <h2>Cadastre-se</h2>

        <p>
          Crie sua conta para organizar suas leituras
        </p>
      </div>

      <form #cadastroForm="ngForm" (ngSubmit)="onSubmit(cadastroForm)">
  
        <div class="input-group">
          <label>Nome</label>
          <input type="text" name="nome" [(ngModel)]="dados.nome" placeholder="Seu nome completo" required>
        </div>
      
        <div class="input-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="dados.email" placeholder="exemplo@email.com" required email>
        </div>
      
        <div class="input-group">
          <label>Senha</label>
          <div class="password-field">
            <input [type]="showPassword ? 'text' : 'password'" name="senha" [(ngModel)]="dados.senha" placeholder="Crie uma senha" required minlength="6">
            
            <button type="button" (click)="togglePassword()">
              👁
            </button>
          </div>
        </div>
      
        <div class="input-group">
          <label>Confirmar Senha</label>
          <div class="password-field">
            <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmarSenha" [(ngModel)]="dados.confirmarSenha" placeholder="Confirme sua senha" required>
            
            <button type="button" (click)="toggleConfirmPassword()">
              👁
            </button>
          </div>
        </div>
      
        <span class="error" *ngIf="erro" style="color: red; display: block; margin-bottom: 10px;">{{ erro }}</span>
      
        <button class="login-button" type="submit">
          Criar Conta
        </button>
      
      </form>

      <div class="register">
        Já possui conta?
        <a routerLink="/login">Entrar</a>
      </div>

    </div>

  </div>

</div>
